---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: employee-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: mazharbaig/employee-backend:latest
          ports:
            - containerPort: 8080
          env:
            # PostgreSQL connection - uses internal Kubernetes DNS
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "postgres123"
            - name: DB_NAME
              value: "employeedb"
            - name: DB_PORT
              value: "5432"
            # Allow requests from the frontend
            - name: ALLOWED_ORIGINS
              value: "*"

---
# Backend Service - NodePort exposes it on port 30800 externally
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: employee-app
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30800
