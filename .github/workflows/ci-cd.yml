name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Login to DockerHub (explicit docker login)
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # Step 3: Build and push backend image
      - name: Build & Push Backend Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/employee-backend:latest \
                       -t ${{ secrets.DOCKERHUB_USERNAME }}/employee-backend:${{ github.run_number }} \
                       ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/employee-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/employee-backend:${{ github.run_number }}

      # Step 4: Build and push frontend image
      - name: Build & Push Frontend Image
        run: |
          docker build \
            --build-arg REACT_APP_SERVER_URL=http://${{ secrets.K3S_SERVER_IP }}:30800/employees \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/employee-frontend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/employee-frontend:${{ github.run_number }} \
            ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/employee-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/employee-frontend:${{ github.run_number }}

      # Step 5: Deploy to K3s Kubernetes
      - name: Deploy to Kubernetes
        env:
          KUBECONFIG_DATA: ${{ secrets.K3S_KUBECONFIG }}
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config

          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/postgres-deployment.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml

          kubectl rollout restart deployment/backend  -n employee-app
          kubectl rollout restart deployment/frontend -n employee-app

          kubectl rollout status deployment/backend  -n employee-app --timeout=180s
          kubectl rollout status deployment/frontend -n employee-app --timeout=180s

      # Step 6: Print live URLs
      - name: Print Live URLs
        run: |
          echo "=========================================="
          echo " Frontend : http://${{ secrets.K3S_SERVER_IP }}:30080"
          echo " Backend  : http://${{ secrets.K3S_SERVER_IP }}:30800"
          echo "=========================================="
