name: CI/CD Pipeline

# Trigger: runs on every push to main branch
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Build and push backend image
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            baigmazhar/employee-backend:latest
            baigmazhar/employee-backend:${{ github.run_number }}

      # Step 4: Build and push frontend image
      # Passes K3s IP as build arg so React bakes the backend URL in
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            REACT_APP_SERVER_URL=http://${{ secrets.K3S_SERVER_IP }}:30800/employees
          tags: |
            baigmazhar/employee-frontend:latest
            baigmazhar/employee-frontend:${{ github.run_number }}

      # Step 5: Deploy to K3s Kubernetes cluster
      - name: Deploy to Kubernetes
        env:
          KUBECONFIG_DATA: ${{ secrets.K3S_KUBECONFIG }}
        run: |
          # Install kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

          # Write kubeconfig from secret
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config

          # Apply all Kubernetes manifests
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/postgres-deployment.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml

          # Restart pods to pull latest images
          kubectl rollout restart deployment/backend  -n employee-app
          kubectl rollout restart deployment/frontend -n employee-app

          # Wait for deployments to be healthy
          kubectl rollout status deployment/backend  -n employee-app --timeout=180s
          kubectl rollout status deployment/frontend -n employee-app --timeout=180s

      # Step 6: Print live URLs
      - name: Print Live URLs
        run: |
          echo "=========================================="
          echo " Frontend : http://${{ secrets.K3S_SERVER_IP }}:30080"
          echo " Backend  : http://${{ secrets.K3S_SERVER_IP }}:30800"
          echo "=========================================="
